# ==============================================================================
# SIYATECH Production Nginx Hardened Configuration (siyatech.tech)
# Comprehensive Security Hardening: OWASP Top 10, CWE Mitigations & Cloudflare SSL
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-force / Form Spam Protection)
limit_req_zone $binary_remote_addr zone=siyatech_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=siyatech_forms:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name siyatech.tech www.siyatech.tech;

    # Force HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siyatech.tech www.siyatech.tech;

    # SSL Certificates (Auto-managed by Certbot or Cloudflare Origin CA)
    # If using Let's Encrypt / Certbot:
    # ssl_certificate /etc/letsencrypt/live/siyatech.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/siyatech.tech/privkey.pem;
    # If using Cloudflare Origin CA:
    # ssl_certificate /etc/ssl/certs/cloudflare_siyatech.pem;
    # ssl_certificate_key /etc/ssl/private/cloudflare_siyatech.key;

    root /var/www/html;
    index index.html;

    # ==========================================================================
    # 1. Information Disclosure Prevention (CWE-497 / ZAP Banner Leak Fix)
    # ==========================================================================
    server_tokens off;

    # Custom Error Pages (Prevents default Nginx version banner)
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    # ==========================================================================
    # 2. HTTP Security Headers (OWASP Top 10 A05 / CWE-693, CWE-1021, CWE-319)
    # ==========================================================================
    # HSTS (Strict-Transport-Security: 1 Year + Preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Anti-Clickjacking Protection (CWE-1021)
    add_header X-Frame-Options "DENY" always;

    # MIME-Sniffing Prevention (CWE-693)
    add_header X-Content-Type-Options "nosniff" always;

    # Content Security Policy (CSP - CWE-693)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.web3forms.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;" always;

    # Referrer & Privacy Control
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (Restricts device sensors and camera/mic)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Cross-Origin Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================================================
    # 3. Cache-Control Policies (CWE-525 / Shared Cache Protection)
    # ==========================================================================
    # HTML Documents: Must revalidate to ensure fresh security policies
    location ~* \.(html)$ {
        limit_req zone=siyatech_general burst=20 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Static Assets (Images, CSS, JS, Fonts): Aggressive immutable caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Robots & Sitemap
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ==========================================================================
    # 4. Hidden & Sensitive Files Protection
    # ==========================================================================
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (\.git|\.env|\.bak|\.config|\.sh|\.sql) {
        deny all;
        return 404;
    }

    # ==========================================================================
    # 5. Secure Contact API Proxy (Hides Web3Forms Key Server-Side)
    # ==========================================================================
    location /api/contact {
        limit_req zone=siyatech_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback Routing
    location / {
        limit_req zone=siyatech_general burst=30 nodelay;
        try_files $uri $uri/ /index.html =404;
    }
}
