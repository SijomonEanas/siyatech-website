# ==============================================================================
# SIYATECH Enterprise Security Headers Snippet
# Can be included in ANY existing server block via:
# include /etc/nginx/snippets/siyatech-security.conf;
# ==============================================================================

# 1. Information Disclosure Prevention (CWE-497)
server_tokens off;

# 2. Custom Error Pages
error_page 404 /404.html;

# 3. HTTP Security Headers (CWE-693, CWE-1021, CWE-319)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.web3forms.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com;" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-XSS-Protection "1; mode=block" always;
