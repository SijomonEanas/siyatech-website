<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="shieldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#031020" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="greenBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Badge -->
  <g transform="translate(8, 6)">
    <!-- Outer Glow Silhouette -->
    <path d="M34 2 L62 13 C62 44 48 59 34 67 C20 59 6 44 6 13 Z" 
          fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.35" filter="url(#neonGlow)"/>

    <!-- Main Shield Body -->
    <path d="M34 2 L62 13 C62 44 48 59 34 67 C20 59 6 44 6 13 Z" 
          fill="url(#shieldGradDark)" stroke="url(#shieldBorder)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner Geometric Circuit Accents -->
    <path d="M34 9 L55 18 C55 42 43 53 34 60 C25 53 13 42 13 18 Z" 
          fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.45"/>

    <!-- ST Monogram -->
    <!-- Stylized Modern 'S' -->
    <path d="M23 25 C23 20 45 20 45 25 C45 29 25 29 25 35 C25 41 45 40 45 35" 
          fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 25 L43 25" 
          fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Central Pillar 'T' in Vibrant Enterprise Green -->
    <path d="M34 25 L34 49" 
          fill="none" stroke="url(#greenBrandGrad)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M28 49 L40 49" 
          fill="none" stroke="url(#greenBrandGrad)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Micro Tech Node Dots -->
    <circle cx="34" cy="14" r="1.5" fill="#38BDF8"/>
    <circle cx="23" cy="25" r="1.5" fill="#38BDF8"/>
    <circle cx="45" cy="35" r="1.5" fill="#4ADE80"/>
  </g>

  <!-- Typography: SIYATECH -->
  <g transform="translate(84, 15)">
    <!-- Brand Title -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="url(#greenBrandGrad)">SIYATECH</text>
    
    <!-- Slogan Subtitle with Precise Typography -->
    <text x="1" y="50" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="8.8" letter-spacing="1.4" fill="#F1F5F9">
      SECURE INFRASTRUCTURE. <tspan fill="#22C55E">YOUR ADVANTAGE.</tspan>
    </text>
  </g>
</svg>
